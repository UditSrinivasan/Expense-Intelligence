name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_test
          POSTGRES_USER: expense_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U expense_test -d expense_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://expense_test@127.0.0.1:5432/expense_test
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://expense_test@127.0.0.1:5432/expense_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24", cache: npm}
      - run: npm ci
      - run: npm run test:web
      - run: npm run lint:web
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace apps/web run test:e2e
